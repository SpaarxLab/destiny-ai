<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="#080808"/>
  <rect x="0" y="0" width="1280" height="12" fill="#72c8f0"/>

  <text x="66" y="82" fill="#72c8f0" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" letter-spacing="7">STING · WEBMCP</text>
  <text x="62" y="192" fill="#f5f2ec" font-family="Arial, Helvetica, sans-serif" font-size="94" font-weight="900" letter-spacing="-4">MAKE YOUR</text>
  <text x="62" y="292" fill="#ff5a38" font-family="Arial, Helvetica, sans-serif" font-size="108" font-weight="900" letter-spacing="-5">AI BET.</text>
  <text x="68" y="356" fill="#a8a6a1" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="600">Then make it pay when it is wrong.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="423" width="430" height="215" rx="30" fill="#111216" stroke="#31333a" stroke-width="4"/>
    <circle cx="122" cy="476" r="21" fill="#72c8f0"/>
    <text x="163" y="487" fill="#72c8f0" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800">THE AGENT BETS</text>
    <text x="112" y="555" fill="#f5f2ec" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="800">“You choose A.”</text>
    <text x="112" y="604" fill="#a8a6a1" font-family="Arial, Helvetica, sans-serif" font-size="25">sealed before your tap</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="780" y="120" width="430" height="518" rx="34" fill="#111216" stroke="#31333a" stroke-width="4"/>
    <text x="824" y="184" fill="#a8a6a1" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" letter-spacing="3">YOUR CHOICE</text>
    <rect x="824" y="220" width="342" height="138" rx="22" fill="#18242a" stroke="#72c8f0" stroke-width="4"/>
    <text x="855" y="282" fill="#72c8f0" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800">A</text>
    <text x="855" y="326" fill="#f5f2ec" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="800">Build the thing.</text>
    <rect x="824" y="382" width="342" height="138" rx="22" fill="#151519" stroke="#31333a" stroke-width="4"/>
    <text x="855" y="444" fill="#a8a6a1" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800">B</text>
    <text x="855" y="488" fill="#f5f2ec" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="800">Stay indispensable.</text>
    <rect x="846" y="551" width="306" height="54" rx="27" fill="#ff5a38"/>
    <text x="887" y="587" fill="#080808" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="900">3 CHIPS SEALED</text>
  </g>

  <g fill="#72c8f0">
    <rect x="556" y="486" width="22" height="78" rx="7"/>
    <rect x="588" y="486" width="22" height="78" rx="7"/>
    <rect x="620" y="486" width="22" height="78" rx="7"/>
    <rect x="652" y="486" width="22" height="78" rx="7"/>
    <rect x="684" y="486" width="22" height="78" rx="7"/>
    <rect x="716" y="486" width="22" height="78" rx="7" opacity="0.24"/>
  </g>
